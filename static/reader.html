<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reader</title>
  <style>
    :root {
      --bg:       #f5f0e8;
      --surface:  #ffffff;
      --text:     #1a1a1a;
      --muted:    #666;
      --border:   #e0e0e0;
      --accent:   #4f46e5;
      --bar-h:    48px;
      --foot-h:   36px;
    }
    [data-theme="dark"] {
      --bg:      #1c1c1e;
      --surface: #2c2c2e;
      --text:    #e8e8e8;
      --muted:   #888;
      --border:  #3a3a3c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .bar-btn {
      display: flex; align-items: center; justify-content: center;
      min-width: 36px; height: 36px;
      border-radius: 8px; border: none;
      background: transparent; color: var(--muted);
      cursor: pointer; flex-shrink: 0;
      font-size: 13px; font-weight: 600;
      transition: background .15s, color .15s;
      padding: 0 6px;
    }
    .bar-btn:hover { background: var(--bg); color: var(--text); }
    .bar-btn svg { width: 18px; height: 18px; }

    #book-title {
      flex: 1; min-width: 0;
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 4px;
    }

    /* ── Viewer ───────────────────────────────────────────────────────────── */
    #viewer-wrap {
      position: fixed;
      top: var(--bar-h);
      bottom: var(--foot-h);
      left: 0; right: 0;
    }

    #viewer { width: 100%; height: 100%; }

    /* Click zones for page turn */
    .nav-zone {
      position: fixed;
      top: var(--bar-h);
      bottom: var(--foot-h);
      width: 56px;
      z-index: 10;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    #zone-prev { left: 0; justify-content: flex-start; padding-left: 6px; }
    #zone-next { right: 0; justify-content: flex-end; padding-right: 6px; }

    .nav-arrow {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .nav-zone:hover .nav-arrow { opacity: 1; }
    .nav-arrow svg { width: 14px; height: 14px; }

    /* ── Footer progress ──────────────────────────────────────────────────── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--foot-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    #prog-track {
      flex: 1; height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    #prog-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .4s;
    }
    #prog-text {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; min-width: 32px; text-align: right;
    }

    /* ── Loading overlay ──────────────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 200;
      font-size: 14px; color: var(--muted);
      transition: opacity .3s;
      padding: 24px;
      text-align: center;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    #overlay-row { display: flex; align-items: center; gap: 10px; }
    #overlay-sub { font-size: 12px; color: var(--muted); max-width: 300px; line-height: 1.5; }
    #overlay-retry {
      display: none;
      margin-top: 4px;
      padding: 8px 20px;
      border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-size: 13px; cursor: pointer;
    }
    #overlay-back { font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; margin-top: 2px; }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header id="topbar">
  <button class="bar-btn" id="btn-back" title="Back to catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </button>
  <span id="book-title">Loading…</span>
  <button class="bar-btn" id="btn-fd" title="Smaller text">A−</button>
  <button class="bar-btn" id="btn-fi" title="Larger text">A+</button>
  <button class="bar-btn" id="btn-theme" title="Toggle theme">
    <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<div id="zone-prev" class="nav-zone" onclick="go(-1)">
  <div class="nav-arrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
</div>

<div id="viewer-wrap"><div id="viewer"></div></div>

<div id="zone-next" class="nav-zone" onclick="go(1)">
  <div class="nav-arrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </div>
</div>

<footer id="footer">
  <div id="prog-track"><div id="prog-fill"></div></div>
  <span id="prog-text">–</span>
</footer>

<div id="overlay">
  <div id="overlay-row">
    <div class="spinner" id="overlay-spinner"></div>
    <span id="overlay-msg">Loading book…</span>
  </div>
  <div id="overlay-sub"></div>
  <button id="overlay-retry" onclick="location.reload()">Try again</button>
  <span id="overlay-back" onclick="history.back()">← Back to catalog</span>
</div>

<!-- JSZip and epub.js are downloaded at Docker build time into /static/lib/ -->
<script>
// Define error UI before loading epub.js so onerror handlers can use it
function showOverlayError(msg) {
  const spinner = document.getElementById('overlay-spinner')
  const msgEl   = document.getElementById('overlay-msg')
  const sub     = document.getElementById('overlay-sub')
  const retry   = document.getElementById('overlay-retry')
  if (spinner) spinner.style.display = 'none'
  if (msgEl)   msgEl.textContent = msg
  if (sub)     sub.textContent = ''
  if (retry)   retry.style.display = 'inline-block'
}
window.onerror = function(msg, src, line, col, err) {
  showOverlayError('JS error: ' + msg + (src ? ' (' + src + ':' + line + ')' : ''))
  return true
}
</script>
<script src="/static/lib/jszip.min.js"
        onerror="showOverlayError('Failed to load JSZip (/static/lib/jszip.min.js missing — rebuild the Docker image)')"></script>
<script src="/static/lib/epub.min.js"
        onerror="showOverlayError('Failed to load epub.js (/static/lib/epub.min.js missing — rebuild the Docker image)')"></script>
<script>
'use strict'

if (typeof ePub === 'undefined') {
  showOverlayError('epub.js did not load. Rebuild the Docker image to bundle it.')
  throw new Error('ePub undefined')
}

// ── State (declared before applyTheme to avoid temporal dead zone) ───────────
let rend = null
let fontSize = parseInt(localStorage.getItem('r-font') || '100', 10)

// ── Theme ─────────────────────────────────────────────────────────────────────
let dark = localStorage.getItem('theme') === 'dark' ||
    (localStorage.getItem('theme') !== 'light' &&
     window.matchMedia('(prefers-color-scheme: dark)').matches)

// Inject theme CSS directly into an epub iframe document.
// epub.js's themes.register/select accumulates rules in the same <style> element
// and !important declarations from prior themes linger, so we own a dedicated
// <style id="opds-theme"> that we fully replace on every switch.
function injectThemeCss(doc, d) {
  if (!doc?.head) return
  let el = doc.getElementById('opds-theme')
  if (!el) {
    el = doc.createElement('style')
    el.id = 'opds-theme'
    doc.head.appendChild(el)
  }
  el.textContent =
    'html,body{background:' + (d ? '#1c1c1e' : '#f5f0e8') + '!important;' +
              'color:'      + (d ? '#e0e0e0' : '#1a1a1a') + '!important;' +
              'line-height:1.75!important}' +
    'p{margin-bottom:.8em!important}'
}

function applyEpubTheme(d) {
  // Query all rendered iframes directly — reliable regardless of epub.js internals
  document.querySelectorAll('#viewer iframe').forEach(iframe => {
    try { injectThemeCss(iframe.contentDocument, d) } catch {}
  })
}

function applyTheme(d) {
  dark = d
  document.documentElement.dataset.theme = d ? 'dark' : 'light'
  document.getElementById('ico-sun').style.display  = d ? 'none' : ''
  document.getElementById('ico-moon').style.display = d ? '' : 'none'
  applyEpubTheme(d)
}
applyTheme(dark)

document.getElementById('btn-theme').addEventListener('click', () => {
  localStorage.setItem('theme', dark ? 'light' : 'dark')
  applyTheme(!dark)
})

// ── Load book ─────────────────────────────────────────────────────────────────
// epub.js needs a full ArrayBuffer, not a URL — when given a URL string it tries
// to fetch META-INF/container.xml and individual chapter files separately,
// which our single-file proxy cannot serve.
const bookRelPath = location.pathname.replace(/^\/read/, '') || '/'
const bookUrl = '/dl' + bookRelPath + location.search

// Progressive loading messages — conversion on some servers takes 1-3 min
const t1 = setTimeout(() => {
  const sub = document.getElementById('overlay-sub')
  if (sub) sub.textContent = 'The server is preparing the file. This may take a minute…'
}, 15000)

const t2 = setTimeout(() => {
  const msgEl = document.getElementById('overlay-msg')
  const sub   = document.getElementById('overlay-sub')
  if (msgEl) msgEl.textContent = 'Still waiting…'
  if (sub)   sub.textContent = 'Conversion is taking longer than usual. Please hold on.'
}, 60000)

const t3 = setTimeout(() => {
  showOverlayError('The server did not respond in time. The conversion may have failed.')
}, 4 * 60 * 1000)

function clearLoadTimers() { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3) }

;(async () => {
  // 1. Download the full EPUB file
  let ab
  try {
    const resp = await fetch(bookUrl)
    if (!resp.ok) throw new Error('HTTP ' + resp.status)
    const msgEl = document.getElementById('overlay-msg')
    if (msgEl) msgEl.textContent = 'Unpacking…'
    ab = await resp.arrayBuffer()
  } catch(e) {
    clearLoadTimers()
    showOverlayError('Download failed: ' + (e?.message || e))
    return
  }

  // 2. Parse in memory
  let book
  try {
    book = ePub(ab)
  } catch(e) {
    clearLoadTimers()
    showOverlayError('Could not parse EPUB: ' + (e?.message || e))
    return
  }

  book.ready.then(async () => {
    const meta = book.packaging?.metadata || book.package?.metadata || {}
    const title = meta.title || 'Book'
    document.title = title + ' · Reader'
    document.getElementById('book-title').textContent = title
    // epub.js requires locations to be generated before percentage is non-zero.
    // Runs in the background after initial render; updates the bar when done.
    try {
      await book.locations.generate(1024)
      const cur = rend?.currentLocation()
      if (cur?.start) setProgress(cur.start.percentage)
    } catch {}
  }).catch(() => {})

  rend = book.renderTo('viewer', {
    width:  '100%',
    height: '100%',
    spread: 'none',
    flow:   'paginated',
  })

  rend.themes.fontSize(fontSize + '%')

  function setProgress(pct01) {
    const pct = Math.round((pct01 || 0) * 100)
    document.getElementById('prog-fill').style.width = pct + '%'
    document.getElementById('prog-text').textContent = pct + '%'
  }

  rend.on('relocated', loc => {
    if (!loc?.start) return
    setProgress(loc.start.percentage)
  })

  rend.on('rendered', (_, view) => {
    try {
      const doc = view.window?.document
      if (!doc) return
      injectThemeCss(doc, dark)  // apply current theme to every newly rendered view
      let tx = 0
      doc.addEventListener('touchstart', e => { tx = e.touches[0].clientX }, { passive: true })
      doc.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - tx
        if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1)
      }, { passive: true })
      doc.addEventListener('click', e => {
        const w = doc.documentElement.clientWidth
        if (e.clientX < w * 0.25)      go(-1)
        else if (e.clientX > w * 0.75) go(1)
      })
    } catch {}
  })

  try {
    await rend.display()
    clearLoadTimers()
    document.getElementById('overlay').classList.add('hidden')
  } catch(e) {
    clearLoadTimers()
    showOverlayError('Could not render book: ' + (e?.message || String(e)))
  }
})()

// ── Navigation ────────────────────────────────────────────────────────────────
function go(dir) {
  if (!rend) return
  dir > 0 ? rend.next() : rend.prev()
}

document.addEventListener('keydown', e => {
  const key = e.key
  if (key === 'ArrowRight' || key === 'ArrowDown' || key === 'PageDown') { e.preventDefault(); go(1) }
  if (key === 'ArrowLeft'  || key === 'ArrowUp'   || key === 'PageUp')   { e.preventDefault(); go(-1) }
})

// Outer swipe (outside the iframe)
let swipeX = 0
document.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX }, { passive: true })
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeX
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1)
}, { passive: true })

document.getElementById('btn-back').addEventListener('click', () => history.back())

// ── Font size ─────────────────────────────────────────────────────────────────
document.getElementById('btn-fd').addEventListener('click', () => setFont(fontSize - 10))
document.getElementById('btn-fi').addEventListener('click', () => setFont(fontSize + 10))

function setFont(size) {
  fontSize = Math.max(70, Math.min(200, size))
  localStorage.setItem('r-font', fontSize)
  rend?.themes.fontSize(fontSize + '%')
}
</script>
</body>
</html>
