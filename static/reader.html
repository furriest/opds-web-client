<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reader</title>
  <style>
    :root {
      --bg:       #f5f0e8;
      --surface:  #ffffff;
      --text:     #1a1a1a;
      --muted:    #666;
      --border:   #e0e0e0;
      --accent:   #4f46e5;
      --bar-h:    48px;
      --foot-h:   36px;
    }
    [data-theme="dark"] {
      --bg:      #1c1c1e;
      --surface: #2c2c2e;
      --text:    #e8e8e8;
      --muted:   #888;
      --border:  #3a3a3c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      z-index: 100;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .bar-btn {
      display: flex; align-items: center; justify-content: center;
      min-width: 36px; height: 36px;
      border-radius: 8px; border: none;
      background: transparent; color: var(--muted);
      cursor: pointer; flex-shrink: 0;
      font-size: 13px; font-weight: 600;
      transition: background .15s, color .15s;
      padding: 0 6px;
    }
    .bar-btn:hover { background: var(--bg); color: var(--text); }
    .bar-btn svg { width: 18px; height: 18px; }

    #book-title {
      flex: 1; min-width: 0;
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 4px;
    }

    /* ── Viewer ───────────────────────────────────────────────────────────── */
    #viewer-wrap {
      position: fixed;
      top: var(--bar-h);
      bottom: var(--foot-h);
      left: 0; right: 0;
    }

    #viewer { width: 100%; height: 100%; }

    /* Click zones for page turn */
    .nav-zone {
      position: fixed;
      top: var(--bar-h);
      bottom: var(--foot-h);
      width: 56px;
      z-index: 10;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    #zone-prev { left: 0; justify-content: flex-start; padding-left: 6px; }
    #zone-next { right: 0; justify-content: flex-end; padding-right: 6px; }

    .nav-arrow {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .nav-zone:hover .nav-arrow { opacity: 1; }
    .nav-arrow svg { width: 14px; height: 14px; }

    /* ── Footer progress ──────────────────────────────────────────────────── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--foot-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    #prog-track {
      flex: 1; height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    #prog-fill {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .4s;
    }
    #prog-text {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; min-width: 32px; text-align: right;
    }

    /* ── Loading overlay ──────────────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      z-index: 200;
      font-size: 14px; color: var(--muted);
      transition: opacity .3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header id="topbar">
  <button class="bar-btn" id="btn-back" title="Back to catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </button>
  <span id="book-title">Loading…</span>
  <button class="bar-btn" id="btn-fd" title="Smaller text">A−</button>
  <button class="bar-btn" id="btn-fi" title="Larger text">A+</button>
  <button class="bar-btn" id="btn-theme" title="Toggle theme">
    <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<div id="zone-prev" class="nav-zone" onclick="go(-1)">
  <div class="nav-arrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
</div>

<div id="viewer-wrap"><div id="viewer"></div></div>

<div id="zone-next" class="nav-zone" onclick="go(1)">
  <div class="nav-arrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </div>
</div>

<footer id="footer">
  <div id="prog-track"><div id="prog-fill"></div></div>
  <span id="prog-text">–</span>
</footer>

<div id="overlay"><div class="spinner"></div> Loading book…</div>

<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
'use strict'

// ── Theme ─────────────────────────────────────────────────────────────────────
let dark = localStorage.getItem('theme') === 'dark' ||
    (localStorage.getItem('theme') !== 'light' &&
     window.matchMedia('(prefers-color-scheme: dark)').matches)

function applyTheme(d) {
  dark = d
  document.documentElement.dataset.theme = d ? 'dark' : 'light'
  document.getElementById('ico-sun').style.display  = d ? 'none' : ''
  document.getElementById('ico-moon').style.display = d ? '' : 'none'
  if (rend) rend.themes.select(d ? 'dark' : 'light')
}
applyTheme(dark)

document.getElementById('btn-theme').addEventListener('click', () => {
  localStorage.setItem('theme', dark ? 'light' : 'dark')
  applyTheme(!dark)
})

// ── Load book ─────────────────────────────────────────────────────────────────
const bookRelPath = location.pathname.replace(/^\/read/, '') || '/'
const bookUrl = '/dl' + bookRelPath + location.search

let rend = null
let fontSize = parseInt(localStorage.getItem('r-font') || '100', 10)

const book = ePub(bookUrl)

book.ready.then(() => {
  const meta = book.packaging?.metadata || book.package?.metadata || {}
  const title = meta.title || 'Book'
  document.title = title + ' · Reader'
  document.getElementById('book-title').textContent = title
}).catch(() => {})

rend = book.renderTo('viewer', {
  width:  '100%',
  height: '100%',
  spread: 'none',
  flow:   'paginated',
})

rend.themes.register('light', {
  body: { 'background': '#f5f0e8 !important', 'color': '#1a1a1a !important', 'line-height': '1.75 !important' },
  p:    { 'margin-bottom': '0.8em !important' },
})
rend.themes.register('dark', {
  body: { 'background': '#1c1c1e !important', 'color': '#e0e0e0 !important', 'line-height': '1.75 !important' },
  p:    { 'margin-bottom': '0.8em !important' },
})
rend.themes.select(dark ? 'dark' : 'light')
rend.themes.fontSize(fontSize + '%')

rend.display()
  .then(() => { document.getElementById('overlay').classList.add('hidden') })
  .catch(err => {
    const ov = document.getElementById('overlay')
    ov.querySelector('.spinner').style.display = 'none'
    ov.textContent = 'Could not load book. ' + (err?.message || err)
  })

rend.on('relocated', loc => {
  if (!loc?.start) return
  const pct = Math.round((loc.start.percentage || 0) * 100)
  document.getElementById('prog-fill').style.width = pct + '%'
  document.getElementById('prog-text').textContent = pct + '%'
})

// Forward clicks inside epub iframe
rend.on('rendered', (_, view) => {
  try {
    const doc = view.window?.document
    if (!doc) return
    let tx = 0
    doc.addEventListener('touchstart', e => { tx = e.touches[0].clientX }, { passive: true })
    doc.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1)
    }, { passive: true })
    doc.addEventListener('click', e => {
      const w = doc.documentElement.clientWidth
      if (e.clientX < w * 0.25)      go(-1)
      else if (e.clientX > w * 0.75) go(1)
    })
  } catch {}
})

// ── Navigation ────────────────────────────────────────────────────────────────
function go(dir) {
  if (!rend) return
  dir > 0 ? rend.next() : rend.prev()
}

document.addEventListener('keydown', e => {
  const key = e.key
  if (key === 'ArrowRight' || key === 'ArrowDown' || key === 'PageDown') { e.preventDefault(); go(1) }
  if (key === 'ArrowLeft'  || key === 'ArrowUp'   || key === 'PageUp')   { e.preventDefault(); go(-1) }
})

// Outer swipe (outside the iframe)
let swipeX = 0
document.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX }, { passive: true })
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - swipeX
  if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1)
}, { passive: true })

document.getElementById('btn-back').addEventListener('click', () => history.back())

// ── Font size ─────────────────────────────────────────────────────────────────
document.getElementById('btn-fd').addEventListener('click', () => setFont(fontSize - 10))
document.getElementById('btn-fi').addEventListener('click', () => setFont(fontSize + 10))

function setFont(size) {
  fontSize = Math.max(70, Math.min(200, size))
  localStorage.setItem('r-font', fontSize)
  rend?.themes.fontSize(fontSize + '%')
}
</script>
</body>
</html>
